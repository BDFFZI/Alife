<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: transparent;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .dock {
            position: absolute;
            inset: 0;
            padding: 6px 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            border-radius: 22px;
            background: linear-gradient(180deg, #242831 0%, #171a20 100%);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.07),
                        inset 0 -1px 0 rgba(0, 0, 0, 0.3);
            cursor: grab;
            touch-action: none;
        }

        .dock.dragging {
            cursor: grabbing;
        }

        .grip {
            width: 16px;
            height: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 3px;
            pointer-events: none;
        }

        .grip i {
            width: 2px;
            height: 2px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.24);
        }

        .orb {
            width: 30px;
            height: 30px;
            padding: 0;
            border: 1px solid transparent;
            border-radius: 50%;
            background: transparent;
            color: rgba(255, 255, 255, 0.5);
            display: grid;
            place-items: center;
            cursor: pointer;
            touch-action: none;
            -webkit-appearance: none;
            appearance: none;
            outline: none;
            transition: color 0.16s ease,
                        background 0.16s ease,
                        border-color 0.16s ease,
                        box-shadow 0.16s ease,
                        transform 0.1s ease;
        }

        .orb svg {
            width: 17px;
            height: 17px;
            pointer-events: none;
        }

        .orb:hover {
            color: rgba(255, 255, 255, 0.82);
            background: rgba(255, 255, 255, 0.06);
        }

        .orb.pressed {
            transform: scale(0.9);
        }

        .orb.active {
            color: #7ee7c7;
            background: rgba(126, 231, 199, 0.15);
            border-color: rgba(126, 231, 199, 0.3);
            box-shadow: 0 0 8px rgba(126, 231, 199, 0.16);
        }

        .orb[data-target="system"].active {
            color: #8ecbff;
            background: rgba(142, 203, 255, 0.15);
            border-color: rgba(142, 203, 255, 0.3);
            box-shadow: 0 0 8px rgba(142, 203, 255, 0.16);
        }

        .orb.temporary,
        .orb.holding {
            color: #ffc766;
            background: rgba(255, 199, 102, 0.15);
            border-color: rgba(255, 199, 102, 0.32);
            box-shadow: 0 0 8px rgba(255, 199, 102, 0.16);
        }

        .orb.error {
            color: #ff9b9b;
            background: rgba(255, 155, 155, 0.15);
            border-color: rgba(255, 155, 155, 0.32);
            box-shadow: 0 0 8px rgba(255, 155, 155, 0.16);
        }

        .orb.unavailable {
            opacity: 0.28;
            cursor: default;
        }

        .orb.unavailable:hover {
            color: rgba(255, 255, 255, 0.5);
            background: transparent;
        }
    </style>
</head>
<body>
<div class="dock" data-drag>
    <div class="grip" aria-hidden="true"><i></i><i></i><i></i></div>
    <button class="orb" data-target="system" type="button" title="系统声音" aria-label="系统声音">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
            <path d="M11 5 6.5 8.5H3v7h3.5L11 19V5Z"/>
            <path d="M15 8.5a5 5 0 0 1 0 7"/>
            <path d="M18 6a9 9 0 0 1 0 12"/>
        </svg>
    </button>
    <button class="orb" data-target="mic" type="button" title="麦克风" aria-label="麦克风">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
            <rect x="9" y="3" width="6" height="11" rx="3"/>
            <path d="M5.5 11.5a6.5 6.5 0 0 0 13 0"/>
            <path d="M12 18v3"/>
            <path d="M8.5 21h7"/>
        </svg>
    </button>
</div>
<script>
    (() => {
        const bridge = window.alifeWindow;
        const post = data => bridge?.postMessage(data);
        const longPressDelay = 350;
        const channels = {
            system: { available: false, active: false },
            mic: { available: false, active: false }
        };

        function setChannel(key, info) {
            const element = document.querySelector(`.orb[data-target="${key}"]`);
            if (!element) return;
            info = info || {};
            channels[key] = info;
            element.classList.toggle('unavailable', !info.available);
            element.classList.toggle('active', !!info.active);
            element.classList.toggle('temporary', !!info.temporary);
            element.setAttribute('aria-pressed', info.active ? 'true' : 'false');
        }

        bridge?.onMessage(message => {
            if (!message) return;
            if (message.type === 'error') {
                const element = document.querySelector(`.orb[data-target="${message.target}"]`);
                if (!element) return;
                element.classList.add('error');
                setTimeout(() => element.classList.remove('error'), 700);
                return;
            }
            if (message.type !== 'state') return;
            setChannel('system', message.system);
            setChannel('mic', message.mic);
        });

        for (const button of document.querySelectorAll('.orb')) {
            const target = button.dataset.target;
            let pointerId = null;
            let holdTimer = null;
            let longPress = false;
            let wasActive = false;

            const clearHold = () => {
                if (holdTimer !== null) {
                    clearTimeout(holdTimer);
                    holdTimer = null;
                }
                button.classList.remove('pressed', 'holding');
            };

            const finish = event => {
                if (pointerId === null || event.pointerId !== pointerId) return;
                pointerId = null;
                clearHold();

                if (longPress || wasActive) {
                    longPress = false;
                    wasActive = false;
                    post({ type: 'stop', target });
                }
                else {
                    wasActive = false;
                }
            };

            button.addEventListener('pointerdown', event => {
                if (event.pointerType === 'mouse' && event.button !== 0) return;
                if (button.classList.contains('unavailable')) return;
                event.preventDefault();
                event.stopPropagation();
                pointerId = event.pointerId;
                longPress = false;
                wasActive = !!channels[target]?.active;
                button.setPointerCapture(event.pointerId);
                button.classList.add('pressed');
                post({ type: 'press', target });

                if (!wasActive) {
                    channels[target] = { ...channels[target], active: true };
                    button.classList.add('active');
                }

                holdTimer = setTimeout(() => {
                    holdTimer = null;
                    longPress = true;
                    button.classList.add('holding');
                }, longPressDelay);
            });
            button.addEventListener('pointerup', finish);
            button.addEventListener('pointercancel', finish);
            button.addEventListener('lostpointercapture', finish);
            button.addEventListener('contextmenu', event => event.preventDefault());
        }

        let drag = null;
        const dock = document.querySelector('[data-drag]');
        dock.addEventListener('pointerdown', event => {
            if (event.pointerType === 'mouse' && event.button !== 0) return;
            if (event.target.closest('.orb')) return;
            event.preventDefault();
            drag = { id: event.pointerId, x: event.screenX, y: event.screenY };
            dock.setPointerCapture(event.pointerId);
            dock.classList.add('dragging');
            post({ type: 'drag_start' });
        });
        window.addEventListener('pointermove', event => {
            if (!drag || event.pointerId !== drag.id) return;
            post({
                type: 'drag_move',
                dx: Math.round(event.screenX - drag.x),
                dy: Math.round(event.screenY - drag.y)
            });
        });
        const endDrag = event => {
            if (!drag || event.pointerId !== drag.id) return;
            drag = null;
            dock.classList.remove('dragging');
            post({ type: 'drag_end' });
        };
        window.addEventListener('pointerup', endDrag);
        window.addEventListener('pointercancel', endDrag);
        dock.addEventListener('lostpointercapture', endDrag);
        window.addEventListener('contextmenu', event => event.preventDefault());

        post({ type: 'ready' });
    })();
</script>
</body>
</html>
