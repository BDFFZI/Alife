<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: transparent;
            user-select: none;
            -webkit-user-select: none;
        }

        .dock {
            width: 100%;
            height: 100%;
            padding: 9px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 32px;
            background: rgba(18, 20, 26, 0.84);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.38);
            cursor: grab;
            touch-action: none;
        }

        .dock:active {
            cursor: grabbing;
        }

        .orb {
            width: 46px;
            height: 46px;
            padding: 0;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.05);
            color: rgba(255, 255, 255, 0.55);
            display: grid;
            place-items: center;
            cursor: pointer;
            touch-action: none;
            transition: color 0.15s ease, background 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease, transform 0.08s ease;
        }

        .orb svg {
            width: 22px;
            height: 22px;
            pointer-events: none;
        }

        .orb:hover {
            background: rgba(255, 255, 255, 0.09);
        }

        .orb.active {
            color: #3ddc97;
            border-color: rgba(61, 220, 151, 0.55);
            background: rgba(61, 220, 151, 0.12);
            box-shadow: 0 0 16px rgba(61, 220, 151, 0.24);
        }

        .orb.temporary {
            color: #ffbf47;
            border-color: rgba(255, 191, 71, 0.55);
            background: rgba(255, 191, 71, 0.12);
            box-shadow: 0 0 16px rgba(255, 191, 71, 0.22);
        }

        .orb.holding {
            transform: scale(0.94);
        }

        .orb.unavailable {
            opacity: 0.28;
            cursor: not-allowed;
            transform: none;
        }
    </style>
</head>
<body>
<div class="dock" data-drag>
    <button class="orb" data-target="system" type="button" title="系统声音" aria-label="系统声音">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
             stroke-linecap="round" stroke-linejoin="round">
            <path d="M11 5 6.5 8.5H3v7h3.5L11 19V5Z"/>
            <path d="M15 8.5a5 5 0 0 1 0 7"/>
            <path d="M18 6a9 9 0 0 1 0 12"/>
        </svg>
    </button>
    <button class="orb" data-target="mic" type="button" title="麦克风" aria-label="麦克风">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
             stroke-linecap="round" stroke-linejoin="round">
            <rect x="9" y="3" width="6" height="11" rx="3"/>
            <path d="M5.5 11.5a6.5 6.5 0 0 0 13 0"/>
            <path d="M12 18v3"/>
            <path d="M8.5 21h7"/>
        </svg>
    </button>
</div>
<script>
    (() => {
        const bridge = window.alifeWindow;
        const post = data => bridge?.postMessage(data);
        const holdDelay = 220;

        function setChannel(key, info) {
            const element = document.querySelector(`.orb[data-target="${key}"]`);
            if (!element) return;
            info = info || {};
            element.classList.toggle('unavailable', !info.available);
            element.classList.toggle('active', !!info.active);
            element.classList.toggle('temporary', !!info.temporary);
        }

        bridge?.onMessage(message => {
            if (!message || message.type !== 'state') return;
            setChannel('system', message.system);
            setChannel('mic', message.mic);
        });

        for (const button of document.querySelectorAll('.orb')) {
            const target = button.dataset.target;
            let pointerId = null;
            let holdTimer = null;
            let longPress = false;

            const finish = (event, cancelled) => {
                if (pointerId === null || event.pointerId !== pointerId) return;
                const wasLongPress = longPress;
                pointerId = null;
                longPress = false;
                if (holdTimer !== null) {
                    clearTimeout(holdTimer);
                    holdTimer = null;
                }
                button.classList.remove('holding');
                if (wasLongPress) post({type: 'hold_end', target: target});
                else if (!cancelled) post({type: 'toggle', target: target});
            };

            button.addEventListener('pointerdown', event => {
                if (event.pointerType === 'mouse' && event.button !== 0) return;
                if (button.classList.contains('unavailable')) return;
                event.preventDefault();
                event.stopPropagation();
                pointerId = event.pointerId;
                longPress = false;
                button.setPointerCapture(event.pointerId);
                holdTimer = setTimeout(() => {
                    holdTimer = null;
                    longPress = true;
                    button.classList.add('holding');
                    post({type: 'hold_start', target: target});
                }, holdDelay);
            });
            button.addEventListener('pointerup', event => finish(event, false));
            button.addEventListener('pointercancel', event => finish(event, true));
            button.addEventListener('lostpointercapture', event => finish(event, true));
            button.addEventListener('contextmenu', event => event.preventDefault());
        }

        let drag = null;
        const dock = document.querySelector('[data-drag]');
        dock.addEventListener('pointerdown', event => {
            if (event.pointerType === 'mouse' && event.button !== 0) return;
            if (event.target.closest('.orb')) return;
            event.preventDefault();
            drag = {id: event.pointerId, x: event.screenX, y: event.screenY};
            dock.setPointerCapture(event.pointerId);
            post({type: 'drag_start'});
        });
        window.addEventListener('pointermove', event => {
            if (!drag || event.pointerId !== drag.id) return;
            post({
                type: 'drag_move',
                dx: Math.round(event.screenX - drag.x),
                dy: Math.round(event.screenY - drag.y)
            });
        });
        const endDrag = event => {
            if (!drag || event.pointerId !== drag.id) return;
            drag = null;
            post({type: 'drag_end'});
        };
        window.addEventListener('pointerup', endDrag);
        window.addEventListener('pointercancel', endDrag);
        dock.addEventListener('lostpointercapture', endDrag);
        window.addEventListener('contextmenu', event => event.preventDefault());

        post({type: 'ready'});
    })();
</script>
</body>
</html>
