<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <title>Alife</title>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=0.5, minimum-scale=0.5, maximum-scale=0.5"/>
    <script>
        (function () {
            var density = window.__alifeDensity;
            if (!density) return;
            var scale = density / window.devicePixelRatio;
            var viewport = document.querySelector('meta[name="viewport"]');
            viewport.content = 'width=device-width, initial-scale=' + scale + ', minimum-scale=' + scale + ', maximum-scale=' + scale;
        })();
    </script>
    <base href="/"/>
    <!-- AntDesign 前端库 -->
    <meta no-antblazor-js no-antblazor-css/>
    <link href="_content/AntDesign/css/ant-design-blazor.css" rel="stylesheet">
    <script src="_content/AntDesign/js/ant-design-blazor.js"></script>
</head>
<body>
<div id="app"></div>
<!-- autostart 必须关闭，由 Blazor Hybrid 桥控制启动时序 -->
<script src="_framework/blazor.webview.js" autostart="false"></script>
</body>
</html>
