<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>陪玩配置编辑器</title>
  <link rel="stylesheet" href="editor-style.css" />
</head>
<body>
  <header>
    <div class="brand">陪玩配置编辑器</div>
    <div class="header-actions">
      <span id="config-path" class="config-path" title="配置文件位置"></span>
      <button id="btn-save-config" class="primary">保存配置</button>
    </div>
  </header>

  <section class="game-bar">
    <label for="game-select">游戏</label>
    <select id="game-select"></select>
    <button id="btn-add-game" class="small primary">+ 新建</button>
    <button id="btn-rename-game" class="small">重命名</button>
    <button id="btn-del-game" class="small danger">删除</button>
    <span class="bar-hint">采集主显示器全屏</span>
  </section>

  <div id="res-info" class="res-info" style="display:none;">
    <span class="res-label">基准分辨率</span><span id="res-base" class="res-val">—</span>
    <span class="res-arrow">→</span>
    <span class="res-label">当前物理分辨率</span><span id="res-current" class="res-val">—</span>
    <span id="res-state" class="res-state"></span>
    <button id="btn-convert-res" class="small" style="display:none;">转换分辨率</button>
  </div>

  <main id="editor-body">
    <div id="no-selection" class="placeholder">请先选择或新建一个游戏</div>

    <div id="game-editor" style="display:none;">
      <!-- 数据采集目标 -->
      <section class="card">
        <div class="card-title">
          <span>数据采集目标</span>
          <span class="hint">拖动卡片可调整采样顺序；值变化时自动汇报给 AI；全部采样项数据有效且有变化时才上报</span>
        </div>
        <div id="target-list"></div>
        <div class="card-actions">
          <button id="btn-add-target" class="small primary">+ 添加采集目标</button>
        </div>
      </section>
    </div>
  </main>

  <script src="bridge.js"></script>
  <script src="renderer.js"></script>

  <!-- 游戏名输入弹窗 -->
  <div id="name-modal" class="modal-mask" style="display:none;">
    <div class="modal">
      <div class="modal-title" id="name-modal-title">新建游戏</div>
      <input id="name-input" type="text" placeholder="输入游戏名称，如：英雄联盟" />
      <div class="modal-actions">
        <button id="btn-name-cancel">取消</button>
        <button id="btn-name-ok" class="primary">确定</button>
      </div>
    </div>
  </div>

  <!-- 删除确认弹窗 -->
  <div id="confirm-modal" class="modal-mask" style="display:none;">
    <div class="modal">
      <div class="modal-title">删除确认</div>
      <div class="confirm-text" id="confirm-text"></div>
      <div class="modal-actions">
        <button id="btn-confirm-cancel">取消</button>
        <button id="btn-confirm-ok" class="danger">删除</button>
      </div>
    </div>
  </div>
</body>
</html>
